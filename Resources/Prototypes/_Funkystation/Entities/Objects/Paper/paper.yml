

- type: entity
  name: Orange Paper
  parent: Paper
  id: PaperOrange
  description: 'Orange paper.'
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#FFA500"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#FFA500"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperLabelType
    paperType: Invoice
  - type: Tag
    tags:
    - Document
    - Trash
    - Paper
  - type: FaxableObject
  - type: PaperVisuals
    backgroundModulate: "#FFA500"
    contentImageModulate: "#FFA500"

- type: entity
  name: Orange Office Paper
  parent: Paper
  id: OfficePaperOrange
  description: 'A single unit of orange bureaucracy.'
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#FFA500"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#FFA500"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperLabelType
    paperType: Invoice
  - type: Tag
    tags:
    - Document
    - Trash
    - Paper
  - type: FaxableObject
  - type: PaperVisuals
    backgroundModulate: "#FFA500"
    contentImageModulate: "#FFA500"
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    contentImagePath: "/Textures/Interface/Paper/paper_content_lined.svg.96dpi.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 16.0, 16.0, 16.0, 16.0


